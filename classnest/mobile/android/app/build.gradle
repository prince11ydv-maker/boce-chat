plugins {
    id 'com.android.application'
}

// This is public Firebase Android app configuration, never a server credential.
// Keep service-account/private-key JSON outside this project and the APK.
def firebaseConfigFile = System.getenv('CLASSNEST_FIREBASE_CONFIG') ? file(System.getenv('CLASSNEST_FIREBASE_CONFIG')) : rootProject.file('firebase-client.json')
def firebaseConfig = firebaseConfigFile.exists() ? new groovy.json.JsonSlurper().parse(firebaseConfigFile) : null
def firebaseClient = firebaseConfig?.client?.find { it.client_info?.android_client_info?.package_name == 'app.classnest.pusoe' }
def firebaseValues = firebaseClient ? [
    google_app_id: firebaseClient.client_info.mobilesdk_app_id,
    google_api_key: firebaseClient.api_key?.getAt(0)?.current_key,
    project_id: firebaseConfig.project_info?.project_id,
    gcm_defaultSenderId: firebaseConfig.project_info?.project_number
] : [:]
if (firebaseConfig && (!firebaseClient || firebaseValues.values().any { !(it instanceof String) || it.isEmpty() })) {
    throw new GradleException('Use the Firebase Android client configuration for app.classnest.pusoe. Server credentials are not accepted.')
}

android {
    namespace 'app.classnest.pusoe'
    compileSdk 35

    defaultConfig {
        applicationId 'app.classnest.pusoe'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
        buildConfigField 'boolean', 'FIREBASE_CONFIGURED', firebaseClient ? 'true' : 'false'
        firebaseValues.each { key, value -> resValue 'string', key, groovy.json.JsonOutput.toJson(value) }
    }

    buildFeatures {
        buildConfig true
    }

    // Release credentials are supplied privately by the owner/build machine.
    // No keystore or signing password belongs in source control.
    def signingFile = System.getenv('CLASSNEST_KEYSTORE')
    if (signingFile) {
        signingConfigs {
            release {
                storeFile file(signingFile)
                storePassword System.getenv('CLASSNEST_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CLASSNEST_KEY_ALIAS')
                keyPassword System.getenv('CLASSNEST_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            debuggable false
            minifyEnabled false
            if (signingFile) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:26.0.1'
}
