# Local dev infra only — Postgres + Redis. The API and web apps run with
# `npm run dev:*` against these, not inside Docker, for fast reloads.
version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boce
      POSTGRES_PASSWORD: boce
      POSTGRES_DB: boce_chat
    ports: ["5432:5432"]
    volumes: ["boce_pg_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  boce_pg_data:
